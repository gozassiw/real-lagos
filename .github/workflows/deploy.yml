# Build the game, publish it to GitHub Pages, then smoke-test the live URL in a mobile browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'scripts/**', '.github/workflows/osm-*.yml', '.github/workflows/devdeps.yml', '.github/workflows/overpass-probe.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Also publish the built site to the gh-pages branch (works with "Deploy from a branch" too)
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          rm -rf .git
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Works when Settings → Pages → Source is "GitHub Actions". With "Deploy from a branch: gh-pages" the build job
  # above already published the site, so a failure here is not fatal.
  deploy:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Wait for the site to be live
        id: live
        run: |
          URL="${{ needs.deploy.outputs.url }}"
          [ -z "$URL" ] && URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}data/lagos/manifest.json")
            [ "$code" = "200" ] && echo "live=yes" >> "$GITHUB_OUTPUT" && echo "::notice::Live at $URL" && exit 0
            sleep 10
          done
          echo "::warning::$URL is not live yet (GitHub Pages not enabled?) — skipping the smoke test"
      - name: Smoke test the live URL (iPhone emulation)
        if: steps.live.outputs.live == 'yes'
        run: node scripts/qa/smoke.mjs "${{ steps.live.outputs.url }}" qa-out
      - name: Publish screenshots to the qa branch
        if: always() && steps.live.outputs.live == 'yes'
        run: |
          mkdir -p qa-out && cd qa-out
          git init -b qa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "QA run $(date -u +%Y-%m-%dT%H:%MZ) for ${{ github.sha }}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:qa
