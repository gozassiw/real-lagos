# Build the game, publish it to GitHub Pages, then smoke-test the live URL in a mobile browser.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'scripts/**', '.github/workflows/osm-*.yml', '.github/workflows/devdeps.yml', '.github/workflows/overpass-probe.yml']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Also publish the built site to the gh-pages branch (works with "Deploy from a branch" too)
        run: |
          cd dist
          touch .nojekyll
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
          rm -rf .git
      - uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Smoke test the live URL (iPhone emulation + desktop)
        env:
          URL: ${{ needs.deploy.outputs.url }}
        run: node scripts/qa/smoke.mjs "$URL" qa-out
      - name: Publish screenshots to the qa branch
        if: always()
        run: |
          mkdir -p qa-out && cd qa-out
          git init -b qa
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "QA run $(date -u +%Y-%m-%dT%H:%MZ) for ${{ github.sha }}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:qa
